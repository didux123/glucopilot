name: GlucoPilot

options:
  bundleIdPrefix: com.didux
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: fr
  groupSortPosition: top

packages:
  GlucoKit:
    path: GlucoKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Le Team ID n'est pas dans le dépôt : il est propre à la machine.
    # À renseigner une fois dans Xcode (onglet Signing & Capabilities), ou via
    # un Config/Local.xcconfig local.
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  GlucoPilot:
    type: application
    platform: iOS
    sources:
      - path: GlucoPilot
        excludes:
          - "Info.plist"
          - "GlucoPilot.entitlements"
    dependencies:
      - package: GlucoKit
      - target: GlucoPilotWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.didux.glucopilot
        PRODUCT_NAME: GlucoPilot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: GlucoPilot/Info.plist
      properties:
        CFBundleDisplayName: GlucoPilot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # Sans ces deux clés, iOS lance l'app en mode compatibilité, avec des
        # bandes noires. Les réglages INFOPLIST_KEY_* ne s'appliquent pas dès
        # lors qu'un Info.plist explicite est fourni.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # La localisation ne sert pas à situer l'utilisateur : elle sert à
        # garder l'app vivante pendant le trajet pour rafraîchir la glycémie.
        NSLocationWhenInUseUsageDescription:
          GlucoPilot utilise votre déplacement pour rafraîchir votre glycémie
          pendant que vous conduisez. Votre position n'est ni enregistrée ni
          transmise.
        NSLocationAlwaysAndWhenInUseUsageDescription:
          GlucoPilot a besoin d'être réveillé quand vous prenez la route, pour
          afficher votre glycémie sur l'écran de la voiture. Votre position
          n'est ni enregistrée ni transmise.
        UIBackgroundModes:
          - location
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
    entitlements:
      path: GlucoPilot/GlucoPilot.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.didux.glucopilot
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.didux.glucopilot.shared

  # Widget et Live Activity : les deux surfaces qui s'affichent dans CarPlay.
  # Aucun entitlement CarPlay n'est requis — c'est tout l'intérêt de passer par
  # WidgetKit et ActivityKit plutôt que par une app CarPlay.
  GlucoPilotWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: GlucoPilotWidgets
        excludes:
          - "Info.plist"
          - "GlucoPilotWidgets.entitlements"
    dependencies:
      - package: GlucoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.didux.glucopilot.widgets
        PRODUCT_NAME: GlucoPilotWidgets
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: GlucoPilotWidgets/Info.plist
      properties:
        CFBundleDisplayName: GlucoPilot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GlucoPilotWidgets/GlucoPilotWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.didux.glucopilot
        # Même groupe, déclaré en premier des deux côtés : c'est ce qui permet
        # à l'extension de lire les identifiants écrits par l'app.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.didux.glucopilot.shared
